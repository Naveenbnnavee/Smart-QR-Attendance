<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="qrShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="qrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Chassis -->
  <rect width="128" height="128" rx="28" fill="#030712"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#qrShieldGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Security Shield Frame -->
  <path d="M64 16 L98 28 C98 68, 64 96, 64 110 C64 96, 30 68, 30 28 Z" fill="#090d16" stroke="url(#qrShieldGrad)" stroke-width="2.5" filter="url(#qrGlow)"/>

  <!-- Dynamic QR Matrix Finder Pattern (Top-Left) -->
  <rect x="42" y="36" width="16" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="46" y="40" width="8" height="8" rx="1.5" fill="#38bdf8"/>

  <!-- Finder Pattern (Top-Right) -->
  <rect x="70" y="36" width="16" height="16" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="74" y="40" width="8" height="8" rx="1.5" fill="#38bdf8"/>

  <!-- Finder Pattern (Bottom-Center) -->
  <rect x="56" y="66" width="16" height="16" rx="3" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <rect x="60" y="70" width="8" height="8" rx="1.5" fill="#10b981"/>

  <!-- QR Data Bits -->
  <circle cx="46" cy="62" r="2.5" fill="#06b6d4"/>
  <circle cx="54" cy="58" r="2.5" fill="#38bdf8"/>
  <circle cx="74" cy="62" r="2.5" fill="#38bdf8"/>
  <circle cx="82" cy="58" r="2.5" fill="#06b6d4"/>
  <circle cx="64" cy="50" r="3" fill="#ffffff" filter="url(#qrGlow)"/>

  <!-- Geo-Fencing Radar Ring Pulse -->
  <path d="M48 24 C58 20, 70 20, 80 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
  <circle cx="64" cy="22" r="3" fill="#10b981" filter="url(#qrGlow)"/>
</svg>
