services:
  - type: web
    name: smart-qr-attendance
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ADMIN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
